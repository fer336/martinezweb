version: "3.8"

services:
  # ⚙️ Backend API (FastAPI) — cms.martinezgasplomeria.com/api/*
  backend:
    image: ghcr.io/fer336/martinezweb-backend:1.7
    networks:
      - network_public
      - martinez-internal
    secrets:
      - source: martinez_backend_env
        target: /run/secrets/backend.env
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"

        # Todo el backend cuelga de /api (auth, admin, trabajos, config,
        # health, docs) — una sola regla de path alcanza.
        - "traefik.http.routers.martinez-backend.rule=Host(`cms.martinezgasplomeria.com`) && PathPrefix(`/api`)"
        - "traefik.http.routers.martinez-backend.entrypoints=websecure"
        - "traefik.http.routers.martinez-backend.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.martinez-backend.priority=100"

        - "traefik.http.services.martinez-backend.loadbalancer.server.port=8000"

  # 🎨 Panel de administración (React) — cms.martinezgasplomeria.com
  admin:
    image: ghcr.io/fer336/martinezweb-admin:1.7
    networks:
      - network_public
      - martinez-internal
    depends_on:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.martinez-admin.rule=Host(`cms.martinezgasplomeria.com`)"
        - "traefik.http.routers.martinez-admin.entrypoints=websecure"
        - "traefik.http.routers.martinez-admin.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.martinez-admin.priority=1"
        - "traefik.http.services.martinez-admin.loadbalancer.server.port=80"

        # Redirect 301 del dominio viejo (cms-martinez.qeva.xyz) al definitivo
        - "traefik.http.routers.martinez-cms-old.rule=Host(`cms-martinez.qeva.xyz`)"
        - "traefik.http.routers.martinez-cms-old.entrypoints=websecure"
        - "traefik.http.routers.martinez-cms-old.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.martinez-cms-old.priority=1"
        - "traefik.http.routers.martinez-cms-old.service=martinez-admin"
        - "traefik.http.routers.martinez-cms-old.middlewares=martinez-cms-old-redirect"
        - "traefik.http.middlewares.martinez-cms-old-redirect.redirectregex.regex=^/(.*)"
        - "traefik.http.middlewares.martinez-cms-old-redirect.redirectregex.replacement=https://cms.martinezgasplomeria.com/$${1}"
        - "traefik.http.middlewares.martinez-cms-old-redirect.redirectregex.permanent=true"

  # 🌐 Sitio web público (Astro estático) — martinezgasplomeria.com
  web:
    image: ghcr.io/fer336/martinezweb-web:1.12
    networks:
      - network_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.martinez-web.rule=Host(`martinezgasplomeria.com`)"
        - "traefik.http.routers.martinez-web.entrypoints=websecure"
        - "traefik.http.routers.martinez-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.martinez-web.priority=1"
        - "traefik.http.services.martinez-web.loadbalancer.server.port=80"

        # Redirect 301 de www al dominio canónico sin www.
        - "traefik.http.routers.martinez-web-www.rule=Host(`www.martinezgasplomeria.com`)"
        - "traefik.http.routers.martinez-web-www.entrypoints=websecure"
        - "traefik.http.routers.martinez-web-www.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.martinez-web-www.priority=1"
        - "traefik.http.routers.martinez-web-www.service=martinez-web"
        - "traefik.http.routers.martinez-web-www.middlewares=martinez-web-www-redirect"
        - "traefik.http.middlewares.martinez-web-www-redirect.redirectregex.regex=^/(.*)"
        - "traefik.http.middlewares.martinez-web-www-redirect.redirectregex.replacement=https://martinezgasplomeria.com/$${1}"
        - "traefik.http.middlewares.martinez-web-www-redirect.redirectregex.permanent=true"

        # Redirect 301 del dominio viejo (martinezplomeria.qeva.xyz) al definitivo,
        # para no perder el SEO ya indexado y no dejar links viejos rotos.
        - "traefik.http.routers.martinez-web-old.rule=Host(`martinezplomeria.qeva.xyz`)"
        - "traefik.http.routers.martinez-web-old.entrypoints=websecure"
        - "traefik.http.routers.martinez-web-old.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.martinez-web-old.priority=1"
        - "traefik.http.routers.martinez-web-old.service=martinez-web"
        - "traefik.http.routers.martinez-web-old.middlewares=martinez-web-old-redirect"
        - "traefik.http.middlewares.martinez-web-old-redirect.redirectregex.regex=^/(.*)"
        - "traefik.http.middlewares.martinez-web-old-redirect.redirectregex.replacement=https://martinezgasplomeria.com/$${1}"
        - "traefik.http.middlewares.martinez-web-old-redirect.redirectregex.permanent=true"

networks:
  network_public:
    external: true
    name: network_public
  martinez-internal:
    driver: overlay
    internal: true

secrets:
  martinez_backend_env:
    external: true
    # Contiene DATABASE_URL, ADMIN_USERNAME, ADMIN_PASSWORD_HASH, JWT_SECRET,
    # CORS_ORIGINS, S3_*
